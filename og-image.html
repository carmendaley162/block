<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=1200">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    width: 1200px;
    height: 630px;
    background: #003366;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    overflow: hidden;
  }
  .emoji {
    font-size: 96px;
    margin-bottom: 24px;
  }
  .title {
    font-size: 72px;
    font-weight: 800;
    color: #ffffff;
    letter-spacing: 0.04em;
    margin-bottom: 16px;
  }
  .subtitle {
    font-size: 28px;
    color: rgba(255, 255, 255, 0.9);
    font-weight: 400;
    text-align: center;
    max-width: 800px;
    line-height: 1.4;
    margin-bottom: 40px;
  }
  .url {
    font-size: 20px;
    color: rgba(255, 255, 255, 0.45);
    letter-spacing: 0.02em;
  }
</style>
</head>
<body>
  <div class="emoji">📋</div>
  <div class="title">Philly BLOCK</div>
  <div class="subtitle">Blueprint for Local Outreach & Community Knowledge</div>
  <div class="url">phillyblock.netlify.app</div>
</body>
</html>
